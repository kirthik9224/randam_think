<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>🎯 Random Thinking</title>
   <link rel="stylesheet" href="index.css">
</head>
<body>

    <div class="game">

        <h1>
            <span class="dice-icon">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <rect x="3" y="3" width="18" height="18" rx="4"></rect>
                    <circle cx="8" cy="8" r="1.3"></circle>
                    <circle cx="16" cy="8" r="1.3"></circle>
                    <circle cx="8" cy="16" r="1.3"></circle>
                    <circle cx="16" cy="16" r="1.3"></circle>
                    <circle cx="12" cy="12" r="1.3"></circle>
                </svg>
            </span>

            <span>Random Thinking</span>
        </h1>


        <input
            id="guessnumber"
            type="number"
            placeholder="Enter 1 - 20"
        >

        <button onclick="check()">Check</button>


        <p id="result">Make your guess!</p>
 <div class="game-stats">
    <span id="level">Level: 1</span>
    <span id="bestLevel">Best: 1</span>
    <span id="completed">Completed: 0</span>
</div>
<div class="score-section">
    <p id="score">Score: 5</p>

    <div class="progress-container">
        <div id="progress-bar"></div>
    </div>

    <p id="progress-text">Progress: 1 / 500</p>
</div>
     <p id="streak">🔥 Streak: 0</p>
     <p id="bestStreak">🏆 Best Streak: 0</p>
       
        

        <p id="attempts">
            Attempts: 0
        </p>

        <p id="hint">
            💡 Hint will appear here
        </p>

        <p id="chances">
            Chances Left: 5
        </p>


        <div id="levelMessage">
            🎉 Level Complete!
        </div>


        <button id="restart" onclick="restartGame()">
            🔄 Play Again
        </button>

        <button onclick="resetProgress()">
            🗑️ Reset Progress
        </button>

    </div>


    <script src="script.js"></script>

</body>
</html>
